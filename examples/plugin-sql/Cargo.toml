# A reverse-architect language plugin for SQL scripts, built the way a third
# party would build one: outside the host's and the bundled plugins' build
# graph, against nothing but the published contract in `wit/`.
#
#   rustup target add wasm32-wasip2
#   cargo build --release --target wasm32-wasip2
#   reverse-architect <repo> --plugin target/wasm32-wasip2/release/plugin_sql.wasm
#
# Pure Rust, so no C toolchain and no wasi-sdk is needed.
[package]
name = "plugin-sql"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "reverse-architect language plugin: tables, views, procedures, functions and triggers in SQL scripts."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "=0.51.0"

# Its own workspace: nothing here is shared with the repository's crates.
[workspace]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
debug = false
panic = "abort"
