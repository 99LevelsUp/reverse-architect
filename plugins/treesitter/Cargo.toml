[package]
name = "treesitter"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "The bundled reverse-architect language plugins: tree-sitter extraction, one component per language family."

[lib]
crate-type = ["cdylib", "rlib"]

# One component per feature. `plugins/build.ps1` builds each feature on its own
# and names the artifact after it; enabling two at once is a build error by
# design (the manifest id is chosen by the feature).
[features]
rust = ["dep:tree-sitter-rust"]
ecmascript = ["dep:tree-sitter-typescript", "dep:tree-sitter-javascript"]
python = ["dep:tree-sitter-python"]
csharp = ["dep:tree-sitter-c-sharp"]
go = ["dep:tree-sitter-go"]
java = ["dep:tree-sitter-java"]

# Exact pins, matching the host's Cargo.lock at the migration: the grammar
# version decides the bytes of every fact, and a caret requirement would let
# the component drift from what the byte-identity gate compared against.
[dependencies]
wit-bindgen = "=0.51.0"
tree-sitter = "=0.26.10"
tree-sitter-rust = { version = "=0.24.2", optional = true }
tree-sitter-typescript = { version = "=0.23.2", optional = true }
tree-sitter-javascript = { version = "=0.25.0", optional = true }
tree-sitter-python = { version = "=0.25.0", optional = true }
tree-sitter-c-sharp = { version = "=0.23.5", optional = true }
tree-sitter-go = { version = "=0.25.0", optional = true }
tree-sitter-java = { version = "=0.23.5", optional = true }
ra-redact = { path = "../../crates/ra-redact" }
