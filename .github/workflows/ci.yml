name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Tests drive real git repositories through libgit2; a runner without an
  # identity makes the fixture commits fail for a reason unrelated to the code.
  GIT_AUTHOR_NAME: ci
  GIT_AUTHOR_EMAIL: ci@example.invalid
  GIT_COMMITTER_NAME: ci
  GIT_COMMITTER_EMAIL: ci@example.invalid
  # Thirty test binaries each link the plugin runtime; keep the parallel links
  # inside a runner's memory.
  CARGO_BUILD_JOBS: 2

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the exact compiler plus clippy and rustfmt;
      # rustup installs it on the first cargo call.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets

  # The search-eval runner (tools/search-eval) is plain Python outside the
  # binary. Its tests replay scripted transcripts over a small fixture repo:
  # no agent, no model, no knowledge base, no network. 3.12 is the floor
  # the runner needs (tarfile's extraction filter).
  search-eval:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tools/search-eval/tests -t tools/search-eval

  # The walkers inside the bundled language plugins, tested natively — one
  # build per language family, exactly as the components are built.
  plugin-crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins
      - name: test every language family
        working-directory: plugins
        run: |
          for lang in rust ecmascript python csharp go java; do
            cargo test -p treesitter --features "$lang"
          done
      # Built outside the plugin workspace, from the published WIT alone.
      - name: test the SQL plugin
        working-directory: examples/plugin-sql
        run: cargo test

  # Rebuild the committed components and compare hashes. Informational until a
  # Linux build and the Windows build that produced the artifacts are known to
  # agree byte for byte; the hard check is that the committed components load
  # and pass the host's suite above.
  #
  # On Windows, because that is where the committed artifacts are built: the
  # paths a component embeds (remapped, but still with the host's separator)
  # make a Linux build differ from a Windows one even for pure-Rust plugins.
  plugin-reproducibility:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: install wasi-sdk 34
        shell: pwsh
        run: |
          curl.exe -sSL -o sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-windows.tar.gz
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\wasi-sdk" | Out-Null
          tar -xzf sdk.tar.gz -C "$env:RUNNER_TEMP\wasi-sdk" --strip-components=1
      - name: rebuild and compare
        shell: pwsh
        run: |
          ./plugins/build.ps1 -Sdk "$env:RUNNER_TEMP\wasi-sdk"
          git diff --exit-code -- plugins/prebuilt
